services:
  hexo-git:
    image: ghcr.io/suqiguniang/hexo-butterfly-static
    container_name: hexo-git
    ports:
      - "10086:80"      # Nginx
      - "4000:4000"     # Hexo server
    volumes:
      # 只映射 source 文件夹和核心配置
      - ./source:/hexo/source
      - ./_config.yml:/hexo/_config.yml
      - ./_config.butterfly.yml:/hexo/_config.butterfly.yml
    environment:
      - NPM_REGISTRY=https://registry.npmmirror.com
      - NODE_ENV=production
    restart: on-failure:3
    networks:
      - hexo-network
networks:
  hexo-network:
    driver: bridge